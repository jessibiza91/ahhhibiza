services:
  db:
    image: postgres:16
    container_name: ahhh_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${AHHH_POSTGRES_DB:?Define AHHH_POSTGRES_DB en .env}
      POSTGRES_USER: ${AHHH_POSTGRES_USER:?Define AHHH_POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${AHHH_POSTGRES_PASSWORD:?Define AHHH_POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AHHH_POSTGRES_USER} -d ${AHHH_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ahhh_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: ahhh_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AHHH_DB_HOST: db
      AHHH_DB_PORT: 5432
      AHHH_REDIS_URL: redis://redis:6379/1
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: ahhh_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/${AHHH_NGINX_CONF:-ahhh.conf}:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/staticfiles:ro
      # Certificados Let's Encrypt del host (los crea/renueva deploy/install_https.sh)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot para el reto ACME de Let's Encrypt
      - ./deploy/certbot/www:/var/www/certbot:ro

volumes:
  pg_data:
  redis_data:
  media_data:
  static_data:
