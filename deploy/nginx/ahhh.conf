# Ahhh! Ibiza - nginx de produccion
#
# Sirve el sitio SIEMPRE por HTTPS (el puerto 80 solo redirige).
# El certificado se lee de /etc/letsencrypt del host (volumen montado en
# docker-compose.yml). En el primer arranque puede ser un temporal autofirmado
# creado por deploy/install_https.sh; una vez que el dominio apunta al servidor,
# el mismo script lo sustituye por el real de Let's Encrypt y el timer
# ahhh-certbot-renew lo renueva automaticamente.
#
# IMPORTANTE: el dominio del certificado debe coincidir con AHHH_DOMAIN del .env.
# Si usas otro dominio, cambia la ruta de los dos ssl_certificate* de abajo.

server {
    listen 80;
    server_name _;

    client_max_body_size 40m;

    # Reto ACME de Let's Encrypt: emision y renovacion sin cortar el trafico.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demas va por HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/ahibiza.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahibiza.com-0001/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 40m;

    location /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/media/;
    }

    location /health/ {
        proxy_pass http://app:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
