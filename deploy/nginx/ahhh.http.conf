# Ahhh! Ibiza - nginx solo HTTP (fase sin certificado)
#
# Usala mientras despliegas por IP o antes de tener un dominio con HTTPS.
# Cuando tengas dominio y certificado, vuelve a la config HTTPS en el .env:
#
#   AHHH_NGINX_CONF=ahhh.conf
#
# y deja tu dominio en AHHH_DOMAIN/AHHH_ALLOWED_HOSTS.

server {
    listen 80;
    server_name _;

    client_max_body_size 40m;

    location /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/media/;
    }

    location /health/ {
        proxy_pass http://app:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}