{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-[#e5e7eb] p-8 rounded-2xl shadow-xl shadow-fuchsia-500/5 border border-slate-200 text-center">
        <h2 class="font-serif text-3xl font-bold text-slate-900 mb-2">Revisa tu correo</h2>
        <p class="text-slate-500 text-sm">
            Si existe una cuenta con ese correo, te hemos enviado un enlace para
            restablecer tu contraseña. Revisa también la carpeta de spam.
        </p>
        <div class="mt-8 pt-6 border-t border-slate-100">
            <a href="{% url 'login' %}"
                class="text-fuchsia-600 font-bold hover:underline">Volver a iniciar sesión</a>
        </div>
    </div>
</div>
{% endblock %}
